<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Oficina Pesca - App Celular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1f2937, #0b1220 60%, #04070f);
            margin: 0;
            padding: 0;
            color: #f3f4f6;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 12px 48px 12px;
        }
        h1 {
            color: #93c5fd;
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .logo {
            width: 120px;
            margin: 0 auto 18px auto;
            display: block;
        }
        .btn {
            display: block;
            width: 100%;
            background: #1d4ed8;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 1.2rem;
            margin: 18px 0 0 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1e40af;
        }
        .info {
            margin-top: 18px;
            color: #cbd5e1;
            font-size: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.png" alt="Logo Oficina" class="logo" onerror="this.style.display='none'">
        <h1>Oficina Pesca</h1>
        <button class="btn" onclick="window.location.href='/web/login'">Acessar Sistema</button>
        <button class="btn" style="background:#0ea5e9; margin-top:10px;" onclick="localizarOficinaNaRede(this)">Localizar Oficina na Rede</button>
        <div class="info">
            <p>Bem-vindo ao app da Oficina Pesca!<br>Use o botão acima para acessar o sistema pelo celular.</p>
        </div>
    </div>

    <script>
        async function localizarOficinaNaRede(btn) {
            const textoOriginal = btn.textContent;
            btn.disabled = true;
            btn.textContent = "Localizando...";
            try {
                const resp = await fetch('/api/discovery', { cache: 'no-store' });
                const data = await resp.json();
                if (data && data.login_url) {
                    window.location.href = data.login_url;
                    return;
                }
                alert('Oficina não localizada automaticamente nesta rede.');
            } catch (_) {
                alert('Falha ao localizar oficina na rede.');
            } finally {
                btn.disabled = false;
                btn.textContent = textoOriginal;
            }
        }
    </script>
    <script type="module" src="/static/ofp_firebase_sync.js"></script>
</body>
</html>
