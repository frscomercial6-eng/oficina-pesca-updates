name: Build e Release (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup (ISCC.exe) não encontrado após instalação."
          }

      - name: Instalar dependências Python para build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller pytest Jinja2 customtkinter pillow bcrypt fastapi uvicorn "python-jose[cryptography]" python-multipart firebase-admin google-api-python-client google-auth-oauthlib google-auth python-dotenv requests fpdf2 reportlab zeroconf

      - name: Testes locais de licença e regressões
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q --ignore=tests/test_api_auth.py
          if ($LASTEXITCODE -ne 0) {
            throw "Testes locais/regressões falharam; build e publicação bloqueados."
          }
          Write-Host "Testes do Desktop executados. O teste API/Supabase é independente e não foi considerado aprovado."

      - name: Garantir client_secret_desktop.json no CI
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET_DESKTOP_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP_JSON }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET_DESKTOP_JSON)) {
            throw "Secret GOOGLE_CLIENT_SECRET_DESKTOP_JSON ausente. Build/release interrompidos; nenhum placeholder será usado."
          }

          try {
            $oauthConfig = $env:GOOGLE_CLIENT_SECRET_DESKTOP_JSON | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Secret GOOGLE_CLIENT_SECRET_DESKTOP_JSON não contém JSON válido. O conteúdo não será exibido."
          }

          $oauthClient = $oauthConfig.installed
          if ([string]::IsNullOrWhiteSpace([string]$oauthClient.client_id) -or
              [string]::IsNullOrWhiteSpace([string]$oauthClient.client_secret) -or
              $oauthClient.client_id -match "(?i)placeholder" -or
              $oauthClient.client_secret -match "(?i)placeholder") {
            throw "Secret GOOGLE_CLIENT_SECRET_DESKTOP_JSON não contém credenciais OAuth desktop válidas."
          }

          Set-Content -Path "client_secret_desktop.json" -Value $env:GOOGLE_CLIENT_SECRET_DESKTOP_JSON -Encoding utf8NoBOM
          Write-Host "client_secret_desktop.json validado e provisionado pelo secret do GitHub."

      - name: Build Windows (exe + instalador + zip portátil)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          cmd /c "chcp 65001>nul && python mestre_build.py --auto --no-bump --target windows > build_ci.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build falhou. Últimas linhas do log:"
            if (Test-Path "build_ci.log") {
              Get-Content "build_ci.log" -Tail 250
            }
            exit $LASTEXITCODE
          }

      - name: Instalar em diretório isolado e validar artefatos Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "PACOTE_ENVIO/Oficina_Pesca_Instalador.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "ofp-v166-install-test"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Instalação de teste isolada falhou com código $($process.ExitCode)."
          }

          foreach ($relativePath in @("Oficina_Pesca.exe", "Atualizador.exe", "unins000.exe")) {
            if (-not (Test-Path (Join-Path $installDir $relativePath) -PathType Leaf)) {
              throw "Arquivo obrigatório ausente na instalação isolada: $relativePath"
            }
          }
          if (Get-ChildItem -Path $installDir -Filter "*.db" -File -Recurse -ErrorAction SilentlyContinue) {
            throw "A instalação isolada incluiu inesperadamente um banco de dados."
          }

          $manifest = Join-Path $PWD "PACOTE_ENVIO/SHA256SUMS.txt"
          $artifacts = @(
            "PACOTE_ENVIO/Oficina_Pesca_Instalador.exe",
            "PACOTE_ENVIO/Oficina_Pesca_Portatil.zip",
            "PACOTE_ENVIO/Atualizador.exe"
          )
          $hashLines = foreach ($path in $artifacts) {
            $fileHash = Get-FileHash -LiteralPath $path -Algorithm SHA256
            "{0}  {1}" -f $fileHash.Hash.ToLowerInvariant(), (Split-Path -Leaf $path)
          }
          $hashLines | Set-Content -LiteralPath $manifest -Encoding ascii
          $hashLines | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
          Write-Host "Instalação isolada validada; hashes SHA-256 registrados sem incluir dados de cliente."

      - name: Upload log de build (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ci-log
          path: build_ci.log
          if-no-files-found: ignore

      - name: Upload artefatos Windows da run
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-artifacts
          path: |
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip
            PACOTE_ENVIO/Atualizador.exe
            PACOTE_ENVIO/SHA256SUMS.txt
          if-no-files-found: error

      - name: Ler versão do projeto
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = (Get-Content version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { throw "version.txt vazio" }
          $tag = "v$v"
          $remoteTag = git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível verificar a tag remota $tag; publicação bloqueada." }
          if (-not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())) {
            throw "A tag remota $tag já existe; publicação bloqueada para evitar sobrescrita."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publicar Release com artefatos
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          name: Oficina de Pesca v${{ steps.version.outputs.version }}
          allowUpdates: false
          updateOnlyUnreleased: true
          replacesArtifacts: false
          makeLatest: true
          artifacts: >-
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe,
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip,
            PACOTE_ENVIO/Atualizador.exe,
            PACOTE_ENVIO/SHA256SUMS.txt
          artifactErrorsFailBuild: true
          body: |
            Release Windows gerada pelo GitHub Actions na branch main.

            Artefatos publicados:
            - Instalador: Oficina_Pesca_Instalador.exe
            - Portátil: Oficina_Pesca_Portatil.zip
            - Bootstrapper: Atualizador.exe
            - Hashes SHA-256: SHA256SUMS.txt

            O APK Android é gerado e validado separadamente com a configuração Firebase oficial.
