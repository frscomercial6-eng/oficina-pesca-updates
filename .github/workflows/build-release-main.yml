name: Build e Release (main)

on:
  push:
    branches: ["main", "release/v1.0.67"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar tag existente
        id: precheck
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content version.txt -Raw).Trim()
          $refs = @(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}")
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível verificar a tag remota." }
          if ($refs.Count -gt 0) {
            $hashes = @($refs | ForEach-Object { ($_ -split "\s+")[0] })
            if ($env:GITHUB_REF -eq "refs/heads/main" -and $hashes -contains $env:GITHUB_SHA) {
              "run_build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
            throw "A tag v$version já existe; publicação bloqueada."
          }
          "run_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Python
        if: steps.precheck.outputs.run_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar Inno Setup
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup (ISCC.exe) não encontrado após instalação."
          }

      - name: Instalar dependências Python para build
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller pytest Jinja2 customtkinter pillow bcrypt fastapi uvicorn "python-jose[cryptography]" python-multipart firebase-admin google-api-python-client google-auth-oauthlib google-auth python-dotenv requests fpdf2 reportlab zeroconf "pypdf>=5.0,<7" "pypdfium2>=4.30" "ctranslate2>=4.0,<5" "sentencepiece>=0.2,<0.3"

      - name: Testes locais de licença e regressões
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testRoot = Join-Path $PWD "runtime_test_isolado/20261112_1015"
          New-Item -ItemType Directory -Force -Path (Join-Path $testRoot "user_data") | Out-Null
          python -c "import sqlite3, sys; sqlite3.connect(sys.argv[1]).close()" (Join-Path $testRoot "oficina_v1.0.66_test.db")
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar banco sintético para os testes isolados." }
          $env:OFP_VALIDACAO_ISOLADA = "1"
          $env:OFP_DB_PATH = Join-Path $testRoot "oficina_v1.0.66_test.db"
          $env:LOCALAPPDATA = Join-Path $testRoot "user_data"
          $env:APPDATA = $env:LOCALAPPDATA
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -m pytest -q --ignore=tests/test_api_auth.py --ignore=tests/test_menu_inicializacao.py --ignore=tests/test_rede_validacao.py
          if ($LASTEXITCODE -ne 0) {
            throw "Testes locais/regressões falharam; build e publicação bloqueados."
          }
          python -m pytest -q tests/test_rede_validacao.py
          if ($LASTEXITCODE -ne 0) { throw "Testes de isolamento de rede falharam." }
          foreach ($perfil in @("ADMIN", "OFICINA", "VENDEDOR")) {
            python -m pytest -q tests/test_menu_inicializacao.py -k $perfil
            if ($LASTEXITCODE -ne 0) { throw "Teste de inicialização do perfil $perfil falhou." }
          }
          Write-Host "Testes do Desktop executados. O teste API/Supabase é independente e não foi considerado aprovado."

      - name: Build Windows (exe + instalador + zip portátil)
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          @'
          import configparser
          cfg = configparser.ConfigParser()
          cfg.read("config.cfg", encoding="utf-8")
          if cfg.has_section("rede_compatibilidade"):
              cfg.remove_option("rede_compatibilidade", "hub_email")
          with open("config.cfg", "w", encoding="utf-8") as arquivo:
              cfg.write(arquivo)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar configuração sem dados pessoais." }
          cmd /c "chcp 65001>nul && python mestre_build.py --auto --no-bump --no-git --target windows > build_ci.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build falhou. Últimas linhas do log:"
            if (Test-Path "build_ci.log") {
              Get-Content "build_ci.log" -Tail 250
            }
            exit $LASTEXITCODE
          }

      - name: Instalar em diretório isolado e validar artefatos Windows
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "PACOTE_ENVIO/Oficina_Pesca_Instalador.exe").Path
          $oldInstaller = Join-Path $env:RUNNER_TEMP "ofp-v166.exe"
          Invoke-WebRequest -Uri "https://github.com/frscomercial6-eng/oficina-pesca-updates/releases/download/v1.0.66/Oficina_Pesca_Instalador.exe" -OutFile $oldInstaller
          if ((Get-FileHash -LiteralPath $oldInstaller -Algorithm SHA256).Hash -ne "EEC9093B21C5E2B3C628764D689203AE461C3C77BF575368E3BDF8C512A4AE33") {
            throw "Hash do instalador oficial v1.0.66 divergente."
          }
          $installDir = Join-Path $env:RUNNER_TEMP "ofp-upgrade-test"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $process = Start-Process -FilePath $oldInstaller -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalação anterior falhou: $($process.ExitCode)." }
          $dataDir = Join-Path $env:LOCALAPPDATA "OficinaPesca"
          $preservar = @(
            (Join-Path $installDir "oficina.db"),
            (Join-Path $installDir "config.cfg"),
            (Join-Path $installDir "config.json"),
            (Join-Path $installDir "versao.json"),
            (Join-Path $installDir "licenca.key"),
            (Join-Path $installDir "config_fiscal\config_fiscal.json"),
            (Join-Path $installDir "config_fiscal\acbrlib.ini"),
            (Join-Path $installDir "config_fiscal\acbr_monitor_setup.txt"),
            (Join-Path $installDir "_internal\assets\client_secret_desktop.json"),
            (Join-Path $dataDir "oficina.db"),
            (Join-Path $dataDir "token.json"),
            (Join-Path $dataDir "licenca.json")
          )
          foreach ($path in $preservar) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            Set-Content -LiteralPath $path -Value "DADO SINTETICO $path" -Encoding ascii
          }
          foreach ($path in @((Join-Path $installDir "oficina.db"), (Join-Path $dataDir "oficina.db"))) {
            Remove-Item -LiteralPath $path
            python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('create table clientes(nome text)'); c.execute('insert into clientes values (?)',('cliente sintetico',)); c.commit(); c.close()" $path
            if ($LASTEXITCODE -ne 0) { throw "Falha criando banco sintético." }
          }
          $antes = @{}
          foreach ($path in $preservar) { $antes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Atualização isolada falhou: $($process.ExitCode)." }
          if (-not (Get-Item (Join-Path $installDir "Oficina_Pesca.exe")).VersionInfo.FileVersion.StartsWith("1.0.67")) {
            throw "Atualização não instalou o executável v1.0.67."
          }
          foreach ($path in $preservar) {
            if (-not (Test-Path -LiteralPath $path) -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $antes[$path]) {
              throw "Atualização alterou dado sintético: $path"
            }
          }
          foreach ($path in @((Join-Path $installDir "oficina.db"), (Join-Path $dataDir "oficina.db"))) {
            python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; assert c.execute('select nome from clientes').fetchone()[0]=='cliente sintetico'; c.close()" $path
            if ($LASTEXITCODE -ne 0) { throw "Banco sintético danificado após atualização." }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "ofp-clean-test"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /COMPONENTS=core,acbrmonitor /DIR=`"$installDir`""
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Instalação de teste isolada falhou com código $($process.ExitCode)."
          }

          foreach ($relativePath in @("Oficina_Pesca.exe", "Atualizador.exe", "unins000.exe")) {
            if (-not (Test-Path (Join-Path $installDir $relativePath) -PathType Leaf)) {
              throw "Arquivo obrigatório ausente na instalação isolada: $relativePath"
            }
          }
          $env:OFP_CI_INSTALL_DIR = $installDir
          @'
          import os
          from pathlib import Path
          from tools.verificar_pacote_release import verificar_diretorio, verificar_zip

          root = Path(os.environ["OFP_CI_INSTALL_DIR"])
          stage = Path("INSTALADOR_FINAL") / "Oficina_Pesca"
          verificar_diretorio(stage)
          verificar_zip("PACOTE_ENVIO/Oficina_Pesca_Portatil.zip", stage)
          verificar_diretorio(root)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Verificação de segredos falhou; publicação bloqueada." }
          if ((Get-FileHash "PACOTE_ENVIO/Atualizador.exe" -Algorithm SHA256).Hash -ne
              (Get-FileHash "INSTALADOR_FINAL/Oficina_Pesca/Atualizador.exe" -Algorithm SHA256).Hash) {
            throw "Atualizador distribuído difere do executável inspecionado."
          }
          if (-not (Get-Item (Join-Path $installDir "Oficina_Pesca.exe")).VersionInfo.FileVersion.StartsWith("1.0.67")) {
            throw "Versão do executável instalado não corresponde à v1.0.67."
          }
          @'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from reportlab.pdfgen import canvas

          with tempfile.TemporaryDirectory(prefix="ofp_pdf_ci_") as pasta:
              origem = Path(pasta) / "teste.pdf"
              resultado = Path(pasta) / "resultado.json"
              pdf = canvas.Canvas(str(origem))
              pdf.drawString(72, 720, "Synthetic technical diagram")
              pdf.save()
              exe = Path(os.environ["OFP_CI_INSTALL_DIR"]) / "Oficina_Pesca.exe"
              args = json.dumps(["https://example.test/diagram.pdf", "TESTE", "MODELO"])
              processo = subprocess.run(
                  [str(exe), "--ofp-busca-vista-pdf-worker", str(origem), str(resultado), args],
                  capture_output=True, timeout=60, check=True,
              )
              dados = json.loads(resultado.read_text(encoding="utf-8"))
              if dados.get("pages") != 1 or dados.get("status") != "text_only":
                  raise RuntimeError("Análise de PDF no executável falhou: " + str(dados))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Teste de PDF no executável instalado falhou; publicação bloqueada." }
          if (Get-ChildItem -Path $installDir -Filter "*.db" -File -Recurse -ErrorAction SilentlyContinue) {
            throw "A instalação isolada incluiu inesperadamente um banco de dados."
          }
          $manifest = Join-Path $PWD "PACOTE_ENVIO/SHA256SUMS.txt"
          $artifacts = @(
            "PACOTE_ENVIO/Oficina_Pesca_Instalador.exe",
            "PACOTE_ENVIO/Oficina_Pesca_Portatil.zip",
            "PACOTE_ENVIO/Atualizador.exe"
          )
          $hashLines = foreach ($path in $artifacts) {
            $fileHash = Get-FileHash -LiteralPath $path -Algorithm SHA256
            "{0}  {1}" -f $fileHash.Hash.ToLowerInvariant(), (Split-Path -Leaf $path)
          }
          $hashLines | Set-Content -LiteralPath $manifest -Encoding ascii
          $hashLines | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
          Write-Host "Instalação isolada validada; hashes SHA-256 registrados sem incluir dados de cliente."

      - name: Upload log de build (sempre)
        if: always() && steps.precheck.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-ci-log
          path: build_ci.log
          if-no-files-found: ignore

      - name: Upload artefatos Windows da run
        if: steps.precheck.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-artifacts
          path: |
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip
            PACOTE_ENVIO/Atualizador.exe
            PACOTE_ENVIO/SHA256SUMS.txt
          if-no-files-found: error

      - name: Ler versão do projeto
        if: steps.precheck.outputs.run_build == 'true'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = (Get-Content version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { throw "version.txt vazio" }
          $tag = "v$v"
          $remoteTag = git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível verificar a tag remota $tag; publicação bloqueada." }
          if (-not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())) {
            throw "A tag remota $tag já existe; publicação bloqueada para evitar sobrescrita."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preparar Release com artefatos
        if: steps.precheck.outputs.run_build == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: Oficina de Pesca v${{ steps.version.outputs.version }}
          draft: true
          allowUpdates: false
          updateOnlyUnreleased: true
          replacesArtifacts: false
          artifacts: >-
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe,
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip,
            PACOTE_ENVIO/Atualizador.exe,
            PACOTE_ENVIO/SHA256SUMS.txt
          artifactErrorsFailBuild: true
          body: |
            Release Windows gerada e validada pelo GitHub Actions.

            Artefatos publicados:
            - Instalador: Oficina_Pesca_Instalador.exe
            - Portátil: Oficina_Pesca_Portatil.zip
            - Bootstrapper: Atualizador.exe
            - Hashes SHA-256: SHA256SUMS.txt

            O APK Android é gerado e validado separadamente com a configuração Firebase oficial.
            Restauração e sincronização automática permanecem bloqueadas por segurança.

      - name: Verificar arquivos enviados ao rascunho
        if: steps.precheck.outputs.run_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "ofp-release-assets"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Falha ao conferir os artefatos do rascunho." }
          foreach ($name in @("Oficina_Pesca_Instalador.exe", "Oficina_Pesca_Portatil.zip", "Atualizador.exe", "SHA256SUMS.txt")) {
            $local = Join-Path "PACOTE_ENVIO" $name
            $remote = Join-Path $download $name
            if (-not (Test-Path -LiteralPath $remote -PathType Leaf) -or
                (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $remote -Algorithm SHA256).Hash) {
              throw "Artefato ausente ou diferente no rascunho: $name"
            }
          }

      - name: Publicar Release validada
        if: steps.precheck.outputs.run_build == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          allowUpdates: true
          updateOnlyUnreleased: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: false
          makeLatest: true
