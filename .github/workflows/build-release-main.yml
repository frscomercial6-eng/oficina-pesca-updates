name: Build e Release (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Garantir google-services.json no módulo Android
        shell: pwsh
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          $src = "google-services.json"
          $dest = "android_apk/app/google-services.json"
          New-Item -ItemType Directory -Path (Split-Path -Parent $dest) -Force | Out-Null

          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICES_JSON)) {
            Set-Content -Path $dest -Value $env:GOOGLE_SERVICES_JSON -Encoding utf8
            Write-Host "google-services.json escrito a partir do secret GOOGLE_SERVICES_JSON."
            exit 0
          }

          if (Test-Path $src) {
            Copy-Item -Force $src $dest
            Write-Host "google-services.json copiado do repositório para o módulo Android."
            exit 0
          }

          Write-Warning "google-services.json não encontrado no repositório/secret. Gerando placeholder compatível com o applicationId com.frs.oficinadepesca para permitir o build no CI."
          $placeholder = @{
              project_info = @{
                project_id = "oficina-pesca-ci"
                project_number = "000000000000"
                name = "oficina-pesca-ci"
                firebase_url = "https://oficina-pesca-ci.firebaseio.com"
                storage_bucket = "oficina-pesca-ci.appspot.com"
              }
              client = @(
                @{
                  client_info = @{
                    mobilesdk_app_id = "1:000000000000:android:0000000000000000"
                    android_client_info = @{
                      package_name = "com.frs.oficinadepesca"
                    }
                  }
                  oauth_client = @()
                  api_key = @(
                    @{
                      current_key = "placeholder"
                    }
                  )
                  services = @{
                    appinvite_service = @{
                      other_platform_oauth_client = @()
                    }
                  }
                }
              )
              configuration_version = "1"
            } | ConvertTo-Json -Depth 10
            Set-Content -Path $dest -Value $placeholder -Encoding utf8

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup (ISCC.exe) não encontrado após instalação."
          }

      - name: Instalar dependências Python para build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller customtkinter pillow bcrypt fastapi uvicorn "python-jose[cryptography]" python-multipart firebase-admin google-api-python-client google-auth-oauthlib google-auth python-dotenv requests fpdf2 reportlab zeroconf

      - name: Garantir client_secret_desktop.json no CI
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET_DESKTOP_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP_JSON }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET_DESKTOP_JSON)) {
            $env:GOOGLE_CLIENT_SECRET_DESKTOP_JSON | Out-File -FilePath "client_secret_desktop.json" -Encoding utf8
            Write-Host "client_secret_desktop.json criado a partir de secret do GitHub."
          } else {
            Write-Warning "Secret GOOGLE_CLIENT_SECRET_DESKTOP_JSON não definido. Gerando placeholder para permitir build."
            $placeholder = @{
              installed = @{
                client_id = "placeholder.apps.googleusercontent.com"
                project_id = "oficina-pesca-ci"
                auth_uri = "https://accounts.google.com/o/oauth2/auth"
                token_uri = "https://oauth2.googleapis.com/token"
                auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
                client_secret = "placeholder"
                redirect_uris = @("http://localhost")
              }
            } | ConvertTo-Json -Depth 6
            Set-Content -Path "client_secret_desktop.json" -Value $placeholder -Encoding utf8
          }

      - name: Build completo (exe + instalador + zip portátil + apk)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          cmd /c "chcp 65001>nul && python mestre_build.py --auto > build_ci.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build falhou. Últimas linhas do log:"
            if (Test-Path "build_ci.log") {
              Get-Content "build_ci.log" -Tail 250
            }
            exit $LASTEXITCODE
          }

      - name: Upload log de build (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ci-log
          path: build_ci.log
          if-no-files-found: ignore

      - name: Upload artefatos finais da run (exe + zip + apk nativo)
        uses: actions/upload-artifact@v4
        with:
          name: build-final-artifacts
          path: |
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip
            PACOTE_ENVIO/apk_celular/*.apk
          if-no-files-found: error

      - name: Ler versão do projeto
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { throw "version.txt vazio" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publicar Release com artefatos
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          name: Oficina de Pesca v${{ steps.version.outputs.version }}
          allowUpdates: true
          updateOnlyUnreleased: false
          replacesArtifacts: true
          makeLatest: true
          artifacts: >-
            PACOTE_ENVIO/Oficina_Pesca_Instalador.exe,
            PACOTE_ENVIO/Oficina_Pesca_Portatil.zip,
            PACOTE_ENVIO/apk_celular/*.apk,
            PACOTE_ENVIO/Atualizador.exe
          artifactErrorsFailBuild: true
          body: |
            Release automática gerada pelo GitHub Actions na branch main.

            Artefatos publicados:
            - Instalador: Oficina_Pesca_Instalador.exe
            - Portátil: Oficina_Pesca_Portatil.zip
            - APK Nativo: oficina_pesca_v${{ steps.version.outputs.version }}.apk
            - Bootstrapper: Atualizador.exe
